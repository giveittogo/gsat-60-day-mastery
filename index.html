ency and reliability."},{"target":"participated","distractors":["performed","prevented","prepared"],"meaning":"participate in = 參加","tag":"participate in","topic":"校園","stem":"More than two hundred students ______ in the river-cleanup project, collecting plastic waste and recording the types of trash they found."},{"target":"role","distractors":["rule","route","room"],"meaning":"play an important role in = 扮演重要角色","tag":"play a role in","topic":"科技","stem":"Battery storage is expected to play an increasingly important ______ in power grids that rely more heavily on solar and wind energy."},{"target":"Although","distractors":["Because","Unless","During"],"meaning":"although + 子句 = 雖然","tag":"although","topic":"連接詞","stem":"______ the early test results were promising, researchers warned that the study was too small to support a firm conclusion."},{"target":"approach","distractors":["amount","address","article"],"meaning":"approach = 方法、途徑","tag":"approach","topic":"教育","stem":"Instead of banning smartphones completely, the school adopted a more flexible ______ that allows teachers to decide when devices support learning."},{"target":"stimulate","distractors":["separate","survive","settle"],"meaning":"stimulate = 激發、刺激","tag":"stimulate","topic":"科學","stem":"The science museum uses interactive models to ______ children's curiosity and encourage them to ask questions about how everyday objects work."}],"cloze":{"t":"公民科學","p":"Professional scientists cannot be everywhere at once. Citizen-science projects invite ordinary people to collect observations about birds, weather, insects, or other subjects. With a phone app, thousands of volunteers can provide data from a much wider area than a small research team could cover. However, large amounts of information are useful only if the data are (1) ______. Projects therefore give volunteers clear instructions and sometimes ask several people to report the same event. Researchers can then compare records and identify unusual r  Because forecasts always contain some uncertainty, authorities must communicate risk without pretending to know exactly what will happen. Repeated drills can help residents become more (3) ______ with emergency procedures. Trust is also important: people are more likely to follow advice when earlier warnings have been accurate and (4) ______. Effective risk communication is therefore not a single message but an ongoing relationship between experts and the (5) ______.","q":[["(1)",["urgency","privacy","fashion","distance"],0,"a sense of urgency = 緊迫感。","urgency"],["(2)",["prepare","borrow","estimate","divide"],0,"chance to prepare = 有時間準備。","prepare"],["(3)",["familiar","vacant","ancient","narrow"],0,"be familiar with procedures。","familiar"],["(4)",["clear","private","temporary","silent"],0,"accurate and clear warnings。","clear"],["(5)",["public","surface","custom","route"],0,"experts and the public。","public"]]},"featureType":"structure","feature":{"t":"珊瑚礁修復","before":"Growing coral fragments and placing them on damaged reefs can help local recovery, but restoration has clear limits.","options":["Newly planted corals still face rising temperatures, pollution, and other stresses.","If those pressures continue, restored areas may be damaged again.","Restoration therefore works best when it is combined with efforts to reduce the causes of reef decline.","Some beaches are popular because tourists enjoy taking photographs there.","Researchers are also studying which coral populations may be more resilient to future conditions."],"order":[0,1,2,4],"after":"The goal is not merely to rebuild what was lost but to improve the reef's chance of surviving future change.","exp":"持續威脅 → 可能再次受損 → 因此要處理根因 → 再研究韌性。"},"translations":[[1,"因為大雨，學校取消了戶外活動。","The school canceled the outdoor activity because of the heavy rain.","because of + N；cancel an activity",["The school","canceled the outdoor activity","because of the heavy rain."],["school","cancel","outdoor activity","rain"]],[1 cts attention but adds little understanding may distract from the objects being displayed. Good design therefore begins with the learning goal rather than the technology itself. In some exhibitions, a simple physical model may be more useful than an expensive digital system. The question is not whether a museum should use technology, but whether each tool helps visitors notice, compare, question, or remember something important.","q":[["What is the author's main point?",["Museum technology should support learning goals rather than exist for its own sake.","Museums should remove all digital tools.","Expensive technology is always better.","Visitors dislike physical models."],0,"重點是科技要服務學習目標。","reading-main"],["What problem can a bright screen cause?",["It may attract attention without improving understanding.","It can make objects larger.","It always damages museum collections.","It prevents visitors from entering."],0,"文章直接說可能 distract from the objects。","reading-detail"],["What can be inferred about simple models?",["They can sometimes be more effective than costly digital systems.","They are useful only for children.","They should be replaced by games.","They cannot explain difficult ideas."],0,"文章明確比較 simple physical model 與 expensive digital system。","reading-inference"]]},"translations":[[1,"缺乏睡眠可能導致注意力不集中。","A lack of sleep may lead to poor concentration.","a lack of；may lead to",["A lack of sleep","may lead to","poor concentration."],["lack","sleep","lead to","concentration"]],[1,"這些學生依照英文程度被分成三組。","The students were divided into three groups based on their English level.","be divided into；based on",["The students","were divided into three groups","based on their English level."],["students","divided","three groups","English level"]]],"stage":"考前強度"},{"no":23,"theme":"機器人與工作再設計","sourceLabel":"科技時勢＋歷屆考法","sourceURL":"","vocab":[{"target":"divided","distractors":["developed","delivered","described"],"meaning":"be divided into = 被分成","tag":"be divided into","to ittle ______ on overall bus use until the city also improved service frequency and reliability, showing that lower prices alone were not enough to change commuting habits."}],"cloze":{"t":"月球基地的科學任務","p":"Plans for longer human stays on the Moon require more than rockets and habitats. Scientists also need to understand the lunar environment in detail. Dust, radiation, extreme temperatures, and long periods of darkness can all affect equipment and human health. New scientific instruments are being designed to study these conditions before larger bases are built. Some experiments will examine how lunar dust moves, while others will measure radiation or test technologies for producing useful resources. The results may help engineers design systems that are more (1) ______. A permanent presence also creates new scientific opportunities because instruments could operate for years instead of during a short visit. However, every kilogram sent to the Moon is expensive, so researchers must decide which experiments provide the greatest (2) ______. International cooperation may reduce cost and allow countries to share (3) ______. At the same time, long-term exploration raises questions about how lunar sites should be protected and used. Building a base is therefore both a technical project and a matter of scientific and political (4) ______. The choices made now may (5) ______ how future generations explore the Moon.","q":[["(1)",["reliable","vacant","ancient","casual"],0,"systems that are more reliable。","reliable"],["(2)",["value","distance","surface","fashion"],0,"provide the greatest value。","value"],["(3)",["resources","customs","opinions","routes"],0,"share resources。","resources"],["(4)",["cooperation","privacy","weather","silence"],0,"political cooperation。","cooperation"],["(5)",["shape","borrow","measure","remove"],0,"shape future exploration = 形塑未來探索。","shape"]]},"featureType":"structure","feature":{"t":"高齡社會的交通","before":"Transportation becomes a major issue when a owing how local styles developed under different historical influences, rather than presenting the culture as if it had developed in only one uniform way."},{"target":"influence","distractors":["introduce","increase","improve"],"meaning":"influence = 影響","tag":"influence","topic":"消費","stem":"The order in which products appear on a shopping app can strongly ______ what customers notice and eventually decide to buy, even when shoppers believe they are making completely independent decisions."}],"cloze":{"t":"博物館中的互動科技","p":"Interactive screens and augmented reality can make museum exhibits more engaging, but technology is not automatically educational. A digital feature should help visitors notice something, compare information, or understand an idea that would otherwise be difficult. If a screen merely flashes bright images, it may (1) ______ attention away from the object itself. Museum designers therefore begin by deciding what visitors should learn and then choose the tool that best supports that goal. Sometimes a simple model or printed diagram is more (2) ______ than an expensive digital display. Maintenance is another concern because software and hardware can become outdated quickly. Museums must consider not only the initial cost but also whether the system can be (3) ______ over time. Good interactive design is usually easy to understand without long instructions and accessible to visitors with different abilities. In this sense, the best technology often feels (4) ______ rather than impressive. It supports the experience without becoming the main (5) ______.","q":[["(1)",["draw","borrow","measure","divide"],0,"draw attention away from = 把注意力拉走。","draw attention"],["(2)",["effective","ancient","private","vacant"],0,"more effective than。","effective"],["(3)",["maintained","hidden","forgotten","removed"],0,"system can be maintained。","maintained"],["(4)",["natural","violent","formal","narrow"],0,"feels natural = 使用自然、不突兀。","natural"],["(5)",["attraction","dist emand, and several delayed repairs, rather than from a single dramatic mistake made immediately before the blackout."},{"target":"aware","distractors":["afraid","awake","alone"],"meaning":"be aware of = 意識到","tag":"be aware of","topic":"健康","stem":"Consumers should be ______ of how online stores use personalized recommendations, since these systems may influence what products people notice first, rather than assuming the order of search results is neutral or random."},{"target":"suitable","distractors":["serious","separate","similar"],"meaning":"suitable for = 適合","tag":"suitable for","topic":"閱讀","stem":"Because the trail becomes steep and slippery after heavy rain, it is not ______ for inexperienced hikers during the winter months, even for visitors who are physically fit but unfamiliar with mountain weather."},{"target":"replace","distractors":["review","remain","refuse"],"meaning":"replace = 取代","tag":"replace","topic":"科技","stem":"Although automated systems can handle many routine tasks, most experts do not expect them to completely ______ human judgment in complex situations, where ethical responsibility, unexpected events, and incomplete information still require human judgment."},{"target":"whereas","distractors":["therefore","because","besides"],"meaning":"whereas = 然而、相較之下","tag":"whereas","topic":"連接詞","stem":"Some students remember new vocabulary best through frequent short reviews, ______ others prefer learning words through longer reading passages and repeated exposure, showing that the most effective study method can differ from one learner to another."}],"cloze":{"t":"微休息與注意力恢復","p":"A short break can sometimes improve concentration, especially during work that requires sustained attention. Yet not every interruption is restorative. Checking messages may feel like a break, but it often introduces new information that keeps the mind (1) ______. A more useful microbreak may involve standing, stretching, getting water, or simply looking away from a screen for a few minutes. The ideal timing depends on the task and the individual. Breaks that are too frequent can (2) ______ work by making it difficult to regain focus. Short pauses also cannot compensate for chronic sleep loss. Their main value is helping people manage mental effort during the day. Some workplaces encourage employees to take brief movement breaks because sitting for long periods also affects physical health. The key is to use breaks (3) ______ rather than automatically. A good pause should make returning to the task easier, not provide an excuse to (4) ______ it. In this sense, microbreaks are a tool for maintaining performance, not a substitute for proper (5) ______.","q":[["(1)",["occupied","vacant","ancient","silent"],0,"keep the mind occupied。","occupied"],["(2)",["interrupt","borrow","estimate","deliver"],0,"interrupt work。","interrupt"],["(3)",["deliberately","rarely","suddenly","nearly"],0,"use breaks deliberately。","deliberately"],["(4)",["avoid","measure","divide","include"],0,"avoid the task。","avoid"],["(5)",["rest","surface","fashion","distance"],0,"proper rest。","rest"]]},"featureType":"structure","feature":{"t":"公民科學的資料品質","before":"Citizen-science projects can collect observations from thousands of volunteers, but large data sets are not automatically reliable.","options":["Participants need clear instructions so that observations are recorded in similar ways.","Projects may also ask several people to report the same event or location.","Researchers can then compare records and identify unusual results that need further checking.","Volunteers sometimes prefer taking photos in the morning rather than at night.","These quality-control steps allow public participation to support rather than weaken scientific research."],"order":[0,1,2,4],"after":"Good project design is therefore essential when professional researchers and the public work together.","exp":"標準化 → 重複觀察 → 比對異常 → 品質控管結論。"},"translations":[[2,"這座博物館提供互動式展覽，讓孩子更容易了解科學。","The mu  review session completed only the night before the test, especially when the material had to be remembered several weeks rather than several hours later."},{"target":"prevent","distractors":["predict","produce","prefer"],"meaning":"prevent = 預防、防止","tag":"prevent","topic":"安全","stem":"Installing wildlife crossings cannot completely eliminate road accidents, but it can help ______ many collisions between vehicles and large animals, particularly on roads that cut across migration routes used at night."},{"target":"divided","distractors":["developed","delivered","described"],"meaning":"be divided into = 被分成","tag":"be divided into","topic":"教育","stem":"For the final project, the class was ______ into small teams, each responsible for researching a different aspect of local history, so the final presentation could combine several perspectives without repeating the same material."},{"target":"responsible","distractors":["regular","ready","related"],"meaning":"be responsible for = 負責","tag":"be responsible for","topic":"校園","stem":"Each research team is ______ for checking its own data carefully before the results are combined into the final report, because one inaccurate measurement can affect the conclusions drawn from the entire project."},{"target":"manage","distractors":["mention","measure","match"],"meaning":"manage = 管理","tag":"manage","topic":"學習","stem":"Students who learn to ______ their time effectively are less likely to leave several major assignments until the night before they are due, which also leaves more time to revise work instead of simply finishing it."},{"target":"achieve","distractors":["attach","avoid","afford"],"meaning":"achieve = 達成、取得","tag":"achieve","topic":"教育","stem":"The team realized that it could not ______ its emissions target simply by buying new equipment; employees also had to change daily operating practices, because equipment upgrades alone could not change wasteful habits across the organization."},{"target":"accessible","distractors":["acceptable","accurate","active"],"meaning":"accessible = 容易取得／使用的","tag":"accessible","topic":"社會","stem":"The renovated station is more ______ to passengers with limited mobility because elevators now connect every platform to street level, eliminating the need for passengers to use stairs or request special assistance."}],"cloze":{"t":"公共運輸的可靠性","p":"People often say they would use public transportation more if fares were lower, but price is only one factor. A bus that is cheap but frequently late may still be unattractive to commuters who need to arrive at work on time. Service frequency, travel time, safety, and clear information all affect whether a system is (1) ______. Reliability becomes especially important when passengers need to transfer between routes. A ten-minute delay on the first bus may cause someone to miss the next connection and add much more time to the trip. Cities can improve reliability by giving buses priority at busy intersections and using real-time data to respond to congestion. They can also provide accurate arrival information so passengers can plan. When service becomes more dependable, people may be more willing to leave their cars at home. This can reduce traffic and make the transportation network more (2) ______. However, improvements should also reach neighborhoods where residents have fewer alternatives. A system is truly successful when it is both efficient and (3) ______. For this reason, planners need to examine who benefits from each investment rather than looking only at total passenger numbers. Transportation policy is ultimately about access as well as (4) ______. The best systems make everyday movement more predictable for a wide (5) ______ of users.","q":[["(1)",["practical","ancient","private","vacant"],0,"whether a system is practical。","practical"],["(2)",["efficient","silent","formal","narrow"],0,"more efficient network。","efficient"],["(3)",["inclusive","temporary","misleading","distant"],0,"efficient and inclusive。","inclusive"],["(4)",["mobility","surface","custom","fashion"],0,"access and mobility。","mobility"],["(5)",["range","route","price","device"],0,"a wide range of users。","range"]]},"featureType":"reading","feature":{"t":"微休息與專注力","p":"A microbreak is a pause of only a few minutes during work or study. It may involve standing up, stretching, getting water, or looking away from a screen. Research suggests that short breaks can sometimes help people maintain attention during long tasks, especially when the work is repetitive or mentally demanding. However, a microbreak is not the same as avoiding work. Constantly checking social media may create more distraction rather than recovery. Nor can short breaks replace adequate sleep or longer periods of rest. Their value depends on timing and purpose: a brief pause can refresh attention, but too many interruptions can make it harder to return to a difficult task.","q":[["What is a microbreak?",["A short, purposeful pause during work or study.","A full day away from work.","A replacement for sleep.","A long social-media session."],0,"第一句直接定義。","reading-detail"],["Why might social-media checking be a poor microbreak?",["It may add distraction instead of helping recovery.","Phones cannot display social media.","It always lasts several hours.","It improves sleep immediately."],0,"文章說 constant checking may create more distraction。","reading-inference"],["What determines whether microbreaks are useful?",["Their timing and purpose.","Only their length in seconds.","Whether a person is outdoors.","Whether work is easy."],0,"最後一句指出 timing and purpose。","reading-main"]]},"translations":[[3,"隨著科技快速發展，人們取得資訊的方式已經有了很大的改變。","With the rapid development of technology, the way people obtain information has changed greatly.","with the development of；the way + S + V",["With the rapid development of technology,","the way people obtain information","has changed greatly."],["development","technology","way","information","changed"]],[3,"許多歷史建築之所以能被保存下來，是因為居民認為它們具有文化價值。","Many historic buildings have been preserved because residents believe they have cultural value.","現在完成式被動；because",["Many historic buildings","have been preserved","because residents believe","they have cultural value."],["historic buildings","preserved","residents","cultural value"]]],"stage":"考前強度"},{"no":29,"theme":"歷史建築的再利用","sourceLabel":"文化／城市＋歷屆考法","sourceURL":"","vocab":[{"target":"available","distractors":["ancient","average","active"],"meaning":"available = 可取得的、可使用的","tag":"available","topic":"科技","stem":"Although the museum's rare manuscripts cannot be handled by visitors, high-resolution digital copies are ______ online for researchers around the world, so scholars can compare the texts without risking damage to the fragile originals."},{"target":"access","distractors":["avoid","admit","attach"],"meaning":"access = 取得、使用","tag":"access","topic":"科技","stem":"Students in remote areas can now ______ laboratory simulations online, allowing them to practice experiments that their schools cannot perform physically, even when expensive equipment is not available in their own classrooms."},{"target":"opportunities","distractors":["opinions","operations","objects"],"meaning":"opportunity = 機會","tag":"opportunity","topic":"教育","stem":"The internship program gives high school students valuable ______ to observe engineers at work and apply classroom knowledge to real projects, before choosing a university major or deciding whether the field suits their interests."},{"target":"lack","distractors":["layer","limit","level"],"meaning":"a lack of = 缺乏","tag":"a lack of","topic":"健康","stem":"A ______ of affordable housing near major employment centers has forced many workers to commute much farther than they did a decade ago, increasing both household expenses and the amount of time people spend traveling each day."},{"target":"based","distractors":["built","broken","brought"],"meaning":"based on = 根據","tag":"based on","topic":"研究","stem":"The committee's recommendation was ______ on several years of traffic data rather than on complaints from a small number of residents, which gave officials a broader picture of how travel patterns had changed over time."},{"target":"purpose","distractors":["pattern","period","position"],"meaning":"purpose = 目的","tag":"purpose","topic":"職場","stem":"The main ______ of the new warning system is to give residents enough time to move to safer areas before severe flooding begins, not simply to report that flooding has already begun after roads become dangerous."},{"target":"privacy","distractors":["progress","practice","pressure"],"meaning":"privacy = 隱私","tag":"privacy","topic":"科技","stem":"As health services move online, hospitals must protect patient ______ while still allowing doctors to access necessary information quickly, especially when information is shared among hospitals, laboratories, and outside service providers."},{"target":"responded","distractors":["repeated","reached","removed"],"meaning":"respond to = 回應","tag":"respond to","topic":"職場","stem":"After residents complained about dangerous crossings near the school, the city ______ by adding brighter signals and lowering the speed limit, after traffic data confirmed that the problem was not limited to a few isolated complaints."},{"target":"support","distractors":["suppose","separate","settle"],"meaning":"support = 支持、支撐","tag":"support","topic":"經濟","stem":"Local festivals can ______ small businesses by attracting visitors who spend money at nearby restaurants, shops, and guesthouses, and helping tourism revenue remain in the community instead of flowing only to large companies."},{"target":"address","distractors":["admire","announce","arrange"],"meaning":"address a problem = 處理問題","tag":"address a problem","topic":"社會","stem":"To ______ the shortage of affordable housing, the city is considering faster building approvals and incentives for smaller rental units, rather than relying only on short-term rent subsidies that do not increase supply."}],"cloze":{"t":"歷史建築的再利用","p":"Old buildings often stand on valuable urban land, so demolition may appear to be the simplest option. Yet some cities choose adaptive reuse, which gives an existing structure a new function. A former factory may become housing, offices, or an arts center. Reuse can preserve local character and reduce the waste created by demolition, but it also presents technical challenges. Older structures may need stronger foundations, safer electrical systems, or better accessibility. The cost can be high, so planners must decide whether the building's historical and environmental value (1) ______ the extra expense. Successful projects usually keep important features while allowing necessary changes. This requires cooperation among architects, engineers, owners, and local communities. If renovation focuses only on appearance, the building may remain difficult to use. If too much is changed, however, the project may lose the very character it was meant to (2) ______. The best solutions therefore balance old and new rather than treating them as complete (3) ______. Adaptive reuse can also support surrounding businesses by attracting new residents and visitors. In this way, a single building may contribute to wider neighborhood (4) ______. The process is complicated, but it shows that preservation can be active and practical rather than simply (5) ______.","q":[["(1)",["justifies","borrows","measures","divides"],0,"value justifies expense = 價值足以合理化成本。","justify"],["(2)",["preserve","remove","estimate","deliver"],0,"preserve character。","preserve"],["(3)",["opposites","routes","customs","prices"],0,"complete opposites。","opposites"],["(4)",["renewal","privacy","distance","fashion"],0,"neighborhood renewal = 社區更新。","renewal"],["(5)",["protective","ancient","vacant","formal"],0,"rather than simply protective = 不只是被動保護。","protective"]]},"featureType":"wordsel","feature":{"t":"減少食品浪費","p":"Food waste is not only a household problem. It also represents wasted water, energy, labor, and land. Better planning can help people buy more {1} amounts of food, while clearer labels may reduce confusion about when food is still safe to eat. Stores can discount products near their expiration dates or {2} unsold food to charities. Restaurants may adjust portion sizes after studying what customers actually leave behind. These actions are different, but they share the same goal: preventing edible food from becoming {3}. Reducing waste also requires people to change habits, because convenience often encourages overbuying. Progress is most likely when businesses, governments, and consumers take {4} responsibility. Small changes at many points in the food system can have a {5} effect.","choices":["appropriate","donate","waste","shared","significant","ancient","private","borrow"],"answers":["appropriate","donate","waste","shared","significant"],"exp":["appropriate amounts","donate food","become waste","shared responsibility","significant effect"]},"translations":[[3,"研究顯示，規律運動不僅有益身體健康，也可能改善睡眠品質。","Research shows that regular exercise not only benefits physical health but may also improve sleep quality.","research shows that；not only...but also",["Research shows that","regular exercise not only benefits physical health","but may also improve sleep quality."],["research","exercise","physical health","sleep quality"]],[3,"當城市不斷擴張時，如何提供足夠且可負擔的住宅就成為重要問題。","As cities continue to expand, providing enough affordable housing becomes an important issue.","as；affordable housing；動名詞主詞",["As cities continue to expand,","providing enough affordable housing","becomes an important issue."],["cities","expand","affordable housing","important issue"]]],"stage":"考前強度"},{"no":30,"theme":"考前總整合：AI、氣候、文化、科學","sourceLabel":"時勢整合＋歷屆高頻考法","sourceURL":"https://www.ceec.edu.tw/xmdoc/cont?sid=0O211573150658099894&xsmsid=0J018586101460336585","vocab":[{"target":"benefit","distractors":["blame","balance","bother"],"meaning":"benefit = 使……受益","tag":"benefit","topic":"教育","stem":"Expanding shaded public spaces can ______ both elderly residents and outdoor workers, who face greater health risks during periods of extreme heat, particularly in neighborhoods where residents have little access to air-conditioned indoor space."},{"target":"recognize","distractors":["recommend","recover","reduce"],"meaning":"recognize = 認出、辨認","tag":"recognize","topic":"生活","stem":"After the coastal town rebuilt its harbor and replaced many old buildings, former residents could barely ______ the place they had known as children, even though the coastline and surrounding hills had remained almost exactly the same."},{"target":"effect","distractors":["effort","event","example"],"meaning":"have an effect on = 對……有影響","tag":"effect","topic":"交通","stem":"The new fare policy had little ______ on overall bus use until the city also improved service frequency and reliability, showing that lower prices alone were not enough to change commuting habits."},{"target":"participated","distractors":["performed","prevented","prepared"],"meaning":"participate in = 參加","tag":"participate in","topic":"校園","stem":"More than two hundred students ______ in the river-cleanup project, collecting plastic waste and recording the types of trash they found, turning the activity into both a cleanup effort and a simple citizen-science project."},{"target":"role","distractors":["rule","route","room"],"meaning":"play an important role in = 扮演重要角色","tag":"play a role in","topic":"科技","stem":"Battery storage is expected to play an increasingly important ______ in power grids that rely more heavily on solar and wind energy, helping operators move electricity from periods of high production to periods of high demand."},{"target":"Although","distractors":["Because","Unless","During"],"meaning":"although + 子句 = 雖然","tag":"although","topic":"連接詞","stem":"______ the early test results were promising, researchers warned that the study was too small to support a firm conclusion, and emphasized that the findings still needed to be repeated with a larger group."},{"target":"approach","distractors":["amount","address","article"],"meaning":"approach = 方法、途徑","tag":"approach","topic":"教育","stem":"Instead of banning smartphones completely, the school adopted a more flexible ______ that allows teachers to decide when devices support learning, rather than applying the same rule to every subject, activity, and age group."},{"target":"stimulate","distractors":["separate","survive","settle"],"meaning":"stimulate = 激發、刺激","tag":"stimulate","topic":"科學","stem":"The science museum uses interactive models to ______ children's curiosity and encourage them to ask questions about how everyday objects work, rather than asking visitors to memorize facts printed on long information panels."},{"target":"connection","distractors":["collection","competition","condition"],"meaning":"a connection between A and B = A 與 B 的關聯","tag":"connection between","topic":"研究","stem":"Several studies have found a close ______ between regular physical activity and better sleep, although the exact cause is still being investigated, though researchers still disagree about how much each factor directly causes the other."},{"target":"misleading","distractors":["flexible","temporary","independent"],"meaning":"misleading = 誤導的","tag":"misleading","topic":"媒體／消費","stem":"The company withdrew the advertisement after regulators concluded that its claim of 'zero environmental impact' was ______ and could give consumers a false impression, particularly because the fine print failed to explain several important limitations of the product."}],"cloze":{"t":"長文閱讀與陌生字","p":"Students often slow down when they encounter an unfamiliar word in a long passage. This reaction is understandable, but stopping to translate every word can make it difficult to follow the author's main idea. Skilled readers first ask whether the unknown word is actually (1) ______ for answering the question. In many cases, surrounding sentences provide enough information to continue reading. Contrast words, examples, definitions, and repeated ideas can all serve as (2) ______. Readers can also identify the word's grammatical role before guessing its meaning. A noun, verb, or adjective will fit the sentence in different ways. The goal is not to ignore vocabulary but to avoid allowing one word to (3) ______ the entire reading process. After understanding the passage as a whole, students can return to important words and examine them more carefully. This approach is especially useful under time pressure because it protects both comprehension and (4) ______. Strong reading therefore depends on deciding where to spend attention, not simply on knowing every word. In an exam, that judgment can make the difference between finishing the passage and running out of (5) ______.","q":[["(1)",["essential","private","ancient","vacant"],0,"essential for answering = 作答是否必要。","essential"],["(2)",["clues","routes","customs","prices"],0,"context clues = 上下文線索。","clues"],["(3)",["control","borrow","measure","deliver"],0,"control the reading process。","control"],["(4)",["speed","surface","fashion","distance"],0,"comprehension and speed。","speed"],["(5)",["time","privacy","value","support"],0,"run out of time。","time"]]},"featureType":"structure","feature":{"t":"能源儲存","before":"Renewable electricity can be produced in large amounts, but solar and wind output does not always match the time when people need power most.","options":["Storage systems can save electricity during periods of high production and release it later.","This can reduce waste and make the grid more flexible.","However, batteries are not the only solution; stronger transmission lines and demand management can also help.","Electricity was used for lighting long before smartphones were invented.","A reliable low-carbon grid will therefore depend on several technologies working together."],"order":[0,1,2,4],"after":"Energy transitions are systems problems, not single-device problems.","exp":"儲能功能 → 優點 → 其他工具 → 多技術整合結論。"},"translations":[[3,"與其一次讀很久，每天花短時間複習可能更有效。","Rather than studying for a long time at once, reviewing for a short time every day may be more effective.","rather than V-ing；動名詞主詞",["Rather than studying for a long time at once,","reviewing for a short time every day","may be more effective."],["rather than","studying","reviewing","every day","effective"]],[3,"為了保護脆弱的自然環境，部分地區限制每天的遊客人數。","To protect the fragile natural environment, some areas limit the number of visitors each day.","to V 表目的；limit the number of",["To protect the fragile natural environment,","some areas limit","the number of visitors each day."],["protect","fragile","environment","limit","visitors"]]],"stage":"考前強度"}],"official":"https://www.ceec.edu.tw/xmdoc/cont?sid=0O211573150658099894&xsmsid=0J018586101460336585"};
const KEY='gsat30_sprint_v2';
let S=JSON.parse(localStorage.getItem(KEY)||'null')||{set:1,name:'',sets:{},weak:{},scores:{},transDone:0};
let chunkPick={};
function SS(n){if(!S.sets[n])S.sets[n]={v:null,c:null,f:null,t:{},done:false};return S.sets[n]}
function save(){localStorage.setItem(KEY,JSON.stringify(S));dash()}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function norm(x){return String(x||'').toLowerCase().replace(/[.,!?;:'"()]/g,' ').replace(/\s+/g,' ').trim()}
function rotate(arr,k){k=((k%arr.length)+arr.length)%arr.length;return arr.slice(k).concat(arr.slice(0,k))}
function addWeak(t){S.weak[t]=(S.weak[t]||0)+1}
function saveName(){S.name=studentName.value.trim();save();msg.textContent='姓名已儲存。'}
function dash(){let done=DATA.sets.filter(x=>SS(x.no).done).length;doneCount.textContent=done;topBar.style.width=done/30*100+'%';topText.textContent=done+' / 30';studentName.value=S.name||'';let keys=Object.keys(S.scores).map(Number).sort((a,b)=>a-b);latestScore.textContent=keys.length?S.scores[keys.at(-1)]+'%':'--';let vals=keys.map(k=>S.scores[k]);avgScore.textContent=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length)+'%':'--';let w=Object.entries(S.weak).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);weakCount.textContent=w.length;transCount.textContent=S.transDone||0;weakList.innerHTML=w.length?w.slice(0,12).map(x=>`<span class="weak">${esc(x[0])} × ${x[1]}</span>`).join(''):'<span class="small">目前尚無錯題紀錄。</span>';scoreList.innerHTML=keys.length?keys.map(k=>`<span class="pill">第${k}回 ${S.scores[k]}%</span>`).join(''):'<span class="small">完成第一回後開始顯示。</span>';tabs.innerHTML=DATA.sets.map(x=>`<button class="settab ${x.no===S.set?'active':SS(x.no).done?'done':''}" onclick="sel(${x.no})">${x.no}${SS(x.no).done?' ✓':''}</button>`).join('')}
function sel(n){S.set=n;save();render();scrollTo({top:160,behavior:'smooth'})}function jumpNext(){let n=DATA.sets.find(x=>!SS(x.no).done)?.no||30;sel(n)}function resetAll(){if(confirm('確定清除這台裝置上的 30 回紀錄嗎？')){localStorage.removeItem(KEY);location.reload()}}
function setData(){return DATA.sets[S.set-1]}
function sectionDone(s){return !!s.v&&!!s.c&&!!s.f&&!!s.t[0]&&!!s.t[1]}
function render(){let d=setData(),s=SS(d.no);app.innerHTML=`<section class="sheet card"><div class="sheethead"><div><h2>第 ${d.no} 回｜${esc(d.theme)}</h2><div class="small">${esc(d.stage)}｜建議 25–35 分鐘</div></div><div class="badges"><span class="badge">10題詞彙</span><span class="badge">5題克漏字</span><span class="badge">${d.featureType==='reading'?'閱讀':d.featureType==='wordsel'?'文意選填':'篇章結構'}</span><span class="badge">中譯英×2</span></div></div><div class="source"><b>本回命題方向：</b>${esc(d.sourceLabel)}。題目與文章皆為原創改寫，不是把歷屆或雜誌原文直接搬入。${d.sourceURL?` <a href="${esc(d.sourceURL)}" target="_blank" rel="noopener">題材來源方向</a>`:''}</div><div class="section" id="vsec"></div><div class="section" id="csec"></div><div class="section" id="fsec"></div><div class="section" id="tsec"></div><div class="actions" id="finish"></div></section>`;renderV(d,s);renderC(d,s);renderF(d,s);renderT(d,s);finishUI(d,s)}
function optionPack(correct,ds,seed){let a=[correct,...ds],pairs=a.map((x,i)=>({x,i}));let r=rotate(pairs,seed%4);return{ops:r.map(z=>z.x),ans:r.findIndex(z=>z.i===0)}}
function radioQ(name,stem,ops,answerIndex,seed,saved){let pairs=ops.map((x,i)=>({x,i})),r=rotate(pairs,seed%ops.length),selected=saved?.answers?.[name];return`<div class="q"><div class="question">${esc(stem)}</div><div class="choices" id="${name}">${r.map((z,j)=>{let cls='choice';if(saved){if(z.i===answerIndex)cls+=' reveal';if(selected===z.i)cls+=selected===answerIndex?' correct':' wrong'}else if(selected===z.i)cls+=' selected';return`<label class="${cls}" onclick="pick('${name}',${z.i},this)"><input type="radio" name="${name}" value="${z.i}" ${selected===z.i?'checked':''} ${saved?'disabled':''}>${String.fromCharCode(65+j)}. ${esc(z.x)}</label>`}).join('')}</div></div>`}
function pick(name,val,el){if(el.querySelector('input').disabled)return;document.querySelectorAll(`#${name} .choice`).forEach(x=>x.classList.remove('selected'));el.classList.add('selected');el.querySelector('input').checked=true}
function renderV(d,s){if(s.v){vsec.innerHTML=`<h3>第一大題｜詞彙與語境 10 題</h3><div class="feedback good">✓ 已交卷：${s.v.correct}/10（${Math.round(s.v.correct*10)}%）</div>${s.v.details.map(x=>`<div class="feedback ${x.ok?'good':'bad'}"><b>${x.i}. ${x.ok?'✓':'✗'} ${esc(x.target)}</b><br>${esc(x.meaning)}</div>`).join('')}`;return}vsec.innerHTML=`<h3>第一大題｜詞彙與語境 10 題</h3><div class="small">後 10 回題幹刻意拉長；不能只看空格前後，要讀完整語境。</div>${d.vocab.map((q,i)=>{let p=optionPack(q.target,q.distractors,d.no*9+i*5);return radioQ('v'+i,`${i+1}. ${q.stem}`,p.ops,p.ans,0,null)}).join('')}<div class="actions"><button class="btn" onclick="submitV()">送出詞彙</button></div><div id="vfb"></div>`}
function submitV(){let d=setData(),s=SS(d.no),answers={},details=[],correct=0;for(let i=0;i<10;i++){let e=document.querySelector(`input[name="v${i}"]:checked`);if(!e){vfb.innerHTML='<div class="feedback warn">還有題目未作答。</div>';return}let q=d.vocab[i],p=optionPack(q.target,q.distractors,d.no*9+i*5),val=+e.value,ok=val===p.ans;answers['v'+i]=val;if(ok)correct++;else addWeak(q.tag);details.push({i:i+1,ok,target:q.target,meaning:q.meaning})}s.v={answers,correct,details};save();render()}
function renderC(d,s){let p=d.cloze;if(s.c){csec.innerHTML=`<h3>第二大題｜綜合測驗 1 篇・5 題</h3><div class="passage">${esc(p.p)}</div><div class="feedback good">✓ 已交卷：${s.c.correct}/5</div>${s.c.details.map(x=>`<div class="feedback ${x.ok?'good':'bad'}"><b>第 ${x.i} 題 ${x.ok?'✓':'✗'}</b><br>${esc(x.exp)}</div>`).join('')}`;return}csec.innerHTML=`<h3>第二大題｜綜合測驗 1 篇・5 題</h3><div class="small">整篇做完再看解析；考點會混合字義、搭配、介系詞、文法與篇章邏輯。</div><div class="passage">${esc(p.p)}</div>${p.q.map((q,i)=>radioQ('c'+i,q[0],q[1],q[2],d.no*7+i,null)).join('')}<div class="actions"><button class="btn" onclick="submitC()">送出綜合測驗</button></div><div id="cfb"></div>`}
function submitC(){let d=setData(),s=SS(d.no),p=d.cloze,answers={},details=[],correct=0;for(let i=0;i<p.q.length;i++){let e=document.querySelector(`input[name="c${i}"]:checked`);if(!e){cfb.innerHTML='<div class="feedback warn">請先完成 5 題。</div>';return}let q=p.q[i],val=+e.value,ok=val===q[2];answers['c'+i]=val;if(ok)correct++;else addWeak(q[4]);details.push({i:i+1,ok,exp:q[3]})}s.c={answers,correct,details};save();render()}
function renderF(d,s){let f=d.feature;if(d.featureType==='reading')renderReading(d,s,f);else if(d.featureType==='wordsel')renderWordsel(d,s,f);else renderStructure(d,s,f)}
function renderReading(d,s,p){if(s.f){fsec.innerHTML=`<h3>輪替題型｜閱讀理解</h3><div class="passage">${esc(p.p)}</div><div class="feedback good">✓ 已交卷：${s.f.correct}/${p.q.length}</div>${s.f.details.map(x=>`<div class="feedback ${x.ok?'good':'bad'}"><b>第 ${x.i} 題 ${x.ok?'✓':'✗'}</b><br>${esc(x.exp)}</div>`).join('')}`;return}fsec.innerHTML=`<h3>輪替題型｜閱讀理解</h3><div class="passage">${esc(p.p)}</div>${p.q.map((q,i)=>radioQ('f'+i,q[0],q[1],q[2],d.no*5+i,null)).join('')}<div class="actions"><button class="btn" onclick="submitReading()">送出閱讀</button></div><div id="ffb"></div>`}
function submitReading(){let d=setData(),s=SS(d.no),p=d.feature,answers={},details=[],correct=0;for(let i=0;i<p.q.length;i++){let e=document.querySelector(`input[name="f${i}"]:checked`);if(!e){ffb.innerHTML='<div class="feedback warn">請先完成全部閱讀題。</div>';return}let q=p.q[i],val=+e.value,ok=val===q[2];answers['f'+i]=val;if(ok)correct++;else addWeak(q[4]);details.push({i:i+1,ok,exp:q[3]})}s.f={answers,correct,details,total:p.q.length};save();render()}
function renderWordsel(d,s,p){let text=p.p;for(let i=1;i<=5;i++)text=text.replace('{'+i+'}',`<span class="featureBlank">(${i}) ______</span>`);let choiceOrder=rotate(p.choices,d.no%p.choices.length);if(s.f){fsec.innerHTML=`<h3>輪替題型｜文意選填</h3><div class="passage">${text}</div><div class="feedback good">✓ 已交卷：${s.f.correct}/5</div>${s.f.details.map(x=>`<div class="feedback ${x.ok?'good':'bad'}"><b>第 ${x.i} 格 ${x.ok?'✓':'✗'}</b><br>${esc(x.exp)}；答案：${esc(x.ans)}</div>`).join('')}`;return}fsec.innerHTML=`<h3>輪替題型｜文意選填</h3><div class="passage">${text}</div><div class="small" style="margin:9px 0">選項：${choiceOrder.map((x,i)=>`${String.fromCharCode(65+i)}. ${esc(x)}`).join('　')}</div>${[0,1,2,3,4].map(i=>`<div class="q"><b>第 ${i+1} 格</b><select id="ws${i}" style="margin-top:7px;width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:9px"><option value="">請選擇</option>${choiceOrder.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></div>`).join('')}<div class="actions"><button class="btn" onclick="submitWordsel()">送出文意選填</button></div><div id="ffb"></div>`}
function submitWordsel(){let d=setData(),s=SS(d.no),p=d.feature,details=[],correct=0,answers={};for(let i=0;i<5;i++){let v=document.getElementById('ws'+i).value;if(!v){ffb.innerHTML='<div class="feedback warn">請先完成 5 格。</div>';return}let ok=v===p.answers[i];answers[i]=v;if(ok)correct++;else addWeak('文意選填：'+p.answers[i]);details.push({i:i+1,ok,exp:p.exp[i],ans:p.answers[i]})}s.f={answers,correct,details,total:5};save();render()}
function renderStructure(d,s,p){let order=rotate(p.options,d.no%p.options.length);if(s.f){fsec.innerHTML=`<h3>輪替題型｜篇章結構（4格5選項）</h3><div class="passage">${esc(p.before)}</div><div class="feedback good">✓ 已交卷：${s.f.correct}/4</div><div class="feedback ${s.f.correct===4?'good':'bad'}">${esc(p.exp)}<br>正確順序：${p.order.map(i=>esc(p.options[i])).join(' → ')}</div><div class="passage">${esc(p.after)}</div>`;return}fsec.innerHTML=`<h3>輪替題型｜篇章結構（4格5選項）</h3><div class="passage">${esc(p.before)}</div><div class="small" style="margin:9px 0">5 個選項中選 4 個，依序填入。</div>${[0,1,2,3].map(i=>`<div class="q"><b>第 ${i+1} 格</b><select id="st${i}" style="margin-top:7px;width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:9px"><option value="">請選擇</option>${order.map(x=>`<option value="${p.options.indexOf(x)}">${esc(x)}</option>`).join('')}</select></div>`).join('')}<div class="passage">${esc(p.after)}</div><div class="actions"><button class="btn" onclick="submitStructure()">送出篇章結構</button></div><div id="ffb"></div>`}
function submitStructure(){let d=setData(),s=SS(d.no),p=d.feature,answers=[],correct=0;for(let i=0;i<4;i++){let v=document.getElementById('st'+i).value;if(v===''){ffb.innerHTML='<div class="feedback warn">請先完成 4 格。</div>';return}v=+v;answers.push(v);if(v===p.order[i])correct++;else addWeak('篇章結構')}s.f={answers,correct,total:4,details:[]};save();render()}
function transObj(raw){return{level:raw[0],zh:raw[1],model:raw[2],focus:raw[3],chunks:raw[4],keys:raw[5]}}
function renderT(d,s){let ts=d.translations.map(transObj);tsec.innerHTML=`<h3>中譯英｜2 題</h3><div class="small">第 1 題有 chunks；第 2 題先自己寫。最後都會「保留中文、遮住英文」再完整復寫。</div>${ts.map((t,i)=>transCard(t,i,s)).join('')}`}
function transCard(t,i,s){if(s.t[i])return`<div class="trans"><b>${i+1}. ${i===0?'Build it':'You can do it'}</b><div class="zh">${esc(t.zh)}</div><div class="feedback good">✓ 復寫完成</div></div>`;let help=i===0?`<div class="chunks">${t.chunks.map((x,j)=>`<button class="chunk" onclick="addChunk(${i},${j})">${esc(x)}</button>`).join('')}</div><div id="chunk${i}" class="answerline"></div>`:`<div class="small">提示只看句型：${esc(t.focus)}</div>`;return`<div class="trans"><b>${i+1}. ${i===0?'Build it｜完整引導':'You can do it｜自己翻'}</b><div class="zh"><b>中文：</b>${esc(t.zh)}</div>${help}<textarea id="tin${i}" placeholder="先自己翻譯"></textarea><div class="actions"><button class="btn" onclick="checkT(${i})">看安全版本</button></div><div id="tfb${i}"></div></div>`}
function addChunk(i,j){let t=transObj(setData().translations[i]);if(!chunkPick[i])chunkPick[i]=[];if(!chunkPick[i].includes(j))chunkPick[i].push(j);document.getElementById('chunk'+i).textContent=chunkPick[i].map(k=>t.chunks[k]).join(' ')}
function missingKeys(txt,keys){let n=norm(txt);return keys.filter(k=>!n.includes(norm(k).split(' ')[0]))}
function checkT(i){let d=setData(),t=transObj(d.translations[i]),txt=document.getElementById('tin'+i).value.trim(),fb=document.getElementById('tfb'+i);if(!txt){fb.innerHTML='<div class="feedback warn">先自己寫一次再看答案。</div>';return}let miss=missingKeys(txt,t.keys);if(miss.length)addWeak('翻譯：'+t.focus);fb.innerHTML=`<div class="feedback ${miss.length?'warn':'good'}">${miss.length?'可再檢查核心意思：'+esc(miss.slice(0,4).join('、')):'主要核心意思有寫到。'}</div><div class="model"><b>安全版本：</b><br>${esc(t.model)}<br><span class="small">${esc(t.focus)}</span><div class="actions"><button class="btn secondary" onclick="rewriteT(${i})">我看好了，遮住英文</button></div></div>`}
function rewriteT(i){let t=transObj(setData().translations[i]);document.getElementById('tfb'+i).innerHTML=`<div class="zh"><b>請重新翻譯：</b><br>${esc(t.zh)}</div><div class="small">英文答案已隱藏。看中文重新思考。</div><textarea id="rw${i}" placeholder="完整復寫英文"></textarea><div class="actions"><button class="btn" onclick="finishT(${i})">完成復寫</button></div><div id="rwfb${i}"></div>`;document.getElementById('rw'+i).focus()}
function finishT(i){let d=setData(),s=SS(d.no),t=transObj(d.translations[i]),txt=document.getElementById('rw'+i).value.trim(),fb=document.getElementById('rwfb'+i);if(!txt){fb.innerHTML='<div class="feedback warn">請先寫出完整句子。</div>';return}let miss=missingKeys(txt,t.keys);if(miss.length){addWeak('翻譯復寫：'+t.focus);save();fb.innerHTML=`<div class="feedback bad">還有核心意思未穩定：${esc(miss.slice(0,4).join('、'))}</div><div class="model"><b>再看一次：</b><br>${esc(t.model)}<div class="actions"><button class="btn secondary" onclick="rewriteT(${i})">再遮住重寫</button></div></div>`;return}s.t[i]=true;S.transDone=(S.transDone||0)+1;save();render()}
function objectiveScore(d,s){let total=10+5+(d.featureType==='reading'?d.feature.q.length:d.featureType==='wordsel'?5:4),correct=(s.v?.correct||0)+(s.c?.correct||0)+(s.f?.correct||0);return Math.round(correct/total*100)}
function finishUI(d,s){if(s.done){finish.innerHTML=`<div class="feedback good" style="width:100%"><b>✓ 第 ${d.no} 回完成</b>｜本回首次作答 ${S.scores[d.no]}%</div>`;return}if(sectionDone(s))finish.innerHTML=`<button class="btn" onclick="completeSet()">✓ 完成本回</button><span class="small">完成後才會記入成績趨勢。</span>`;else finish.innerHTML=`<span class="small">完成三個客觀題區＋2 題翻譯後即可完成本回。</span>`}
function completeSet(){let d=setData(),s=SS(d.no);s.done=true;S.scores[d.no]=objectiveScore(d,s);save();render();scrollTo({top:0,behavior:'smooth'})}
function reportText(){let done=DATA.sets.filter(x=>SS(x.no).done).length,keys=Object.keys(S.scores).map(Number).sort((a,b)=>a-b),avg=keys.length?Math.round(keys.map(k=>S.scores[k]).reduce((a,b)=>a+b,0)/keys.length):'--',w=Object.entries(S.weak).sort((a,b)=>b[1]-a[1]).slice(0,6);return`學測英文 30 回衝刺\n學生：${S.name||'未填'}\n完成：${done}/30 回\n最近一回：${keys.length?S.scores[keys.at(-1)]+'%':'--'}\n平均：${avg}${avg==='--'?'':'%'}\n翻譯復寫：${S.transDone||0} 題\n\n主要弱項：\n${w.length?w.map((x,i)=>`${i+1}. ${x[0]} × ${x[1]}`).join('\n'):'目前無明顯弱項'}\n\n成績：\n${keys.map(k=>`第${k}回 ${S.scores[k]}%`).join('\n')||'尚無'}`}
async function copyReport(){try{await navigator.clipboard.writeText(reportText());msg.textContent='✓ 報告已複製。'}catch(e){msg.textContent='瀏覽器未允許複製，請下載報告。'}}function downloadReport(){let b=new Blob([reportText()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`GSAT30_${S.name||'student'}.txt`;a.click();URL.revokeObjectURL(a.href)}
dash();render();
</script></body></html>
