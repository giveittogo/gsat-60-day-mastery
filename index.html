function ansV(j){let d=S.day,s=DS(d);if(s.rep)return;let ids=vq(d),i=s.vi,v=V[ids[i]],o=opts(v,d*13+i*5),ok=j===o.ans;paint('vc',j,o.ans);mark(d,ok);setTimeout(()=>{if(ok)vfb.innerHTML=`<div class="feedback good"><b>答對了。</b><br>${v[2]}<div style="margin-top:8px"><button class="btn" onclick="nextV()">下一題</button></div></div>`;else{weak(v[3]);s.rep={n:0};vfb.innerHTML=`<div class="feedback bad"><b>這題答錯了，先別急著往下。</b><br>正解：<b>${v[0]}</b><br>${v[2]}</div>`;repUI()}save()},130)}
function repUI(){let d=S.day,s=DS(d),ids=vq(d),v=V[ids[s.vi]],n=s.rep.n;if(n>=2){vfb.innerHTML+=`<div class="feedback good"><b>✓ 修復完成</b><br>同概念已換句子再做兩次。<div style="margin-top:8px"><button class="btn" onclick="doneRep()">繼續</button></div></div>`;return}let o=opts(v,d*29+s.vi*7+n),stem=v[5][(d+s.vi+n+1)%3];vfb.innerHTML+=`<div class="repair"><b>修復題 ${n+1}/2</b><div class="question">${esc(stem)}</div><div class="choices" id="rc">${o.a.map((x,j)=>`<button class="choice" onclick="ansR(${j})">${String.fromCharCode(65+j)}. ${esc(x)}</button>`).join('')}</div><div id="rfb"></div></div>`}
function ansR(j){let d=S.day,s=DS(d),v=V[vq(d)[s.vi]],n=s.rep.n,o=opts(v,d*29+s.vi*7+n);paint('rc',j,o.ans);setTimeout(()=>{if(j===o.ans)rfb.innerHTML=`<div class="feedback good">✓ 對。${v[2]}<div style="margin-top:8px"><button class="btn" onclick="advR()">下一個修復題</button></div></div>`;else rfb.innerHTML=`<div class="feedback warn">再試一次。先記住：${v[2]}<div style="margin-top:8px"><button class="btn secondary" onclick="renderV()">重新嘗試</button></div></div>`},130)}function advR(){DS(S.day).rep.n++;save();renderV()}function doneRep(){DS(S.day).rep=null;S.mastered++;save();nextV()}function nextV(){let s=DS(S.day);if(s.vi===4){s.vi=5;save();vs.innerHTML='<h3>第一大題｜詞彙／句意 10 題</h3><div class="checkpoint"><b>5 / 10 完成</b><br><span class="small">先停一下，後面再 5 題。</span><div style="margin-top:9px"><button class="btn" onclick="render()">繼續</button></div></div>';return}s.vi++;if(s.vi>=10){s.vd=true;save();render()}else{save();renderV()}}
function renderMain(){let d=S.day,s=DS(d);if(s.main){ms.innerHTML='<h3>今日主要題型</h3><div class="feedback good">✓ 已完成。</div>';return}let type=mainType(d);if(type==='cloze'){let p=C[d%C.length];ms.innerHTML=`<h3>第二大題｜綜合測驗 1 篇・5 題</h3><div class="hint">整篇做完再解析，不另外加 repair，避免 loading 太重。</div><div class="passage">${esc(p.p)}</div>${p.q.map((q,i)=>objQ('cq'+i,q[0],q[1],d+i)).join('')}<div class="actions"><button class="btn" onclick="submitC()">送出綜合測驗</button></div><div id="mfb"></div>`}else{let p=READ[d%READ.length];ms.innerHTML=`<h3>閱讀理解｜1 篇・3 題</h3><div class="hint">第二週後逐步加入；第一週固定都是綜合測驗。</div><div class="passage">${esc(p.p)}</div>${p.q.map((q,i)=>objQ('rq'+i,q[0],q[1],d+i)).join('')}<div class="actions"><button class="btn" onclick="submitR()">送出閱讀</button></div><div id="mfb"></div>`}}
function objQ(name,stem,ops,seed){let a=ops.map((x,i)=>({x,i})),k=seed%4,b=a.slice(k).concat(a.slice(0,k));return`<div class="rq"><b>${esc(stem)}</b><div class="choices" style="margin-top:7px">${b.map((z,j)=>`<label class="choice"><input type="radio" name="${name}" value="${z.i}"> ${String.fromCharCode(65+j)}. ${esc(z.x)}</label>`).join('')}</div></div>`}
function submitC(){let d=S.day,p=C[d%C.length],okall=true,out='',c=0;p.q.forEach((q,i)=>{let e=document.querySelector(`input[name="cq${i}"]:checked`);if(!e){okall=false;return}let ok=+e.value===q[2];mark(d,ok);if(ok)c++;else weak(q[4]);out+=`<div class="feedback ${ok?'good':'bad'}"><b>第 ${i+1} 題：${ok?'✓ 正確':'✗ 需要再看'}</b><br>${q[3]}</div>`});if(!okall){mfb.innerHTML='<div class="feedback warn">請先完成 5 題。</div>';return}DS(d).main=true;save();mfb.innerHTML=out+`<div class="feedback good">本篇首次作答：${c}/5</div><div class="actions"><button class="btn" onclick="render()">進入翻譯</button></div>`}
function submitR(){let d=S.day,p=READ[d%READ.length],okall=true,out='',c=0;p.q.forEach((q,i)=>{let e=document.querySelector(`input[name="rq${i}"]:checked`);if(!e){okall=false;return}let ok=+e.value===q[2];mark(d,ok);if(ok)c++;else weak(q[4]);out+=`<div class="feedback ${ok?'good':'bad'}"><b>第 ${i+1} 題：${ok?'✓ 正確':'✗ 需要再看'}</b><br>${q[3]}</div>`});if(!okall){mfb.innerHTML='<div class="feedback warn">請先完成 3 題。</div>';return}DS(d).main=true;save();mfb.innerHTML=out+`<div class="feedback good">本篇首次作答：${c}/3</div><div class="actions"><button class="btn" onclick="render()">進入翻譯</button></div>`}
function pickT(d){let l=level(d),a=T.filter(x=>x[0]<=l),st=d*3%a.length;return[0,1,2].map(i=>a[(st+i)%a.length])}function renderTrans(){let d=S.day,s=DS(d),a=pickT(d);ts.innerHTML=`<h3>中譯英｜每天 3 題</h3><div class="hint">第1題完整 chunks；第2題部分提示；第3題自己翻。每題最後都要重新看到中文、遮住英文，再完整復寫。</div>${a.map((t,i)=>tcard(t,i,!!s.tr[i])).join('')}`}
function tcard(t,i,done){if(done)return`<div class="trans"><b>${i+1}. ${i===0?'Build it｜完整引導':i===1?'Try it｜部分提示':'You can do it｜自己翻'}</b><div class="zh">${esc(t[1])}</div><div class="feedback good">✓ 已完成復寫</div></div>`;let h=i===0?`<div class="small">先依序點 chunks：</div><div class="chunks">${t[4].map((x,j)=>`<button class="chunk" onclick="addChunk(${i},${j})">${esc(x)}</button>`).join('')}</div><div class="answerline" id="ca${i}"></div><button class="btn secondary" onclick="clearChunk(${i})">清除</button>`:i===1?`<div class="model"><b>提示：</b>${esc(t[3])}<br><span class="small">只給核心搭配，不給完整答案。</span></div>`:`<div class="small">先自己找主詞、動詞、時態，再下筆。</div>`;return`<div class="trans"><b>${i+1}. ${i===0?'Build it｜完整引導':i===1?'Try it｜部分提示':'You can do it｜自己翻'}</b><div class="zh"><b>中文：</b>${esc(t[1])}</div>${h}<textarea id="ti${i}" placeholder="請輸入你的英文翻譯"></textarea><div class="actions"><button class="btn" onclick="checkT(${i})">看解析並準備復寫</button></div><div id="tf${i}"></div></div>`}
function addChunk(i,j){let t=pickT(S.day)[i];TC[i]=TC[i]||[];if(!TC[i].includes(j))TC[i].push(j);document.getElementById('ca'+i).textContent=TC[i].map(k=>t[4][k]).join(' ')}function clearChunk(i){TC[i]=[];document.getElementById('ca'+i).textContent=''}function miss(txt,keys){let n=norm(txt);return keys.filter(k=>!n.includes(norm(k).split(' ')[0]))}
function checkT(i){let t=pickT(S.day)[i],txt=document.getElementById('ti'+i).value.trim();if(!txt){document.getElementById('tf'+i).innerHTML='<div class="feedback warn">請先自己寫一次。</div>';return}let m=miss(txt,t[5]);if(m.length)weak('翻譯：'+t[3]);save();document.getElementById('tf'+i).innerHTML=`<div class="feedback ${m.length?'warn':'good'}"><b>${m.length?'有些核心意思可以再檢查':'主要核心意思有寫到'}</b>${m.length?'<br>檢查：'+esc(m.slice(0,4).join('、')):''}</div><div class="model"><b>安全版本：</b><br>${esc(t[2])}<br><span class="small">${esc(t[3])}</span><div class="actions"><button class="btn secondary" onclick="rewrite(${i})">我看好了，遮住英文答案</button></div></div>`}
function rewrite(i){let t=pickT(S.day)[i];document.getElementById('tf'+i).innerHTML=`<div class="zh"><b>請重新翻譯：</b><br>${esc(t[1])}</div><div class="small">英文答案已隱藏。現在要從中文重新思考。</div><textarea id="rw${i}" placeholder="請完整復寫英文"></textarea><div class="actions"><button class="btn" onclick="finishT(${i})">完成復寫</button></div><div id="rwf${i}"></div>`}
function finishT(i){let d=S.day,s=DS(d),t=pickT(d)[i],txt=document.getElementById('rw'+i).value.trim();if(!txt){document.getElementById('rwf'+i).innerHTML='<div class="feedback warn">請先把完整英文寫出來。</div>';return}let m=miss(txt,t[5]);if(m.length){weak('翻譯復寫：'+t[3]);save();document.getElementById('rwf'+i).innerHTML=`<div class="feedback bad">還有部分核心意思沒穩定寫出來：${esc(m.slice(0,4).join('、'))}</div><div class="model"><b>再看一次：</b><br>${esc(t[2])}<div class="actions"><button class="btn secondary" onclick="rewrite(${i})">再遮住重寫</button></div></div>`}else{s.tr[i]=true;save();document.getElementById('rwf'+i).innerHTML=`<div class="feedback good"><b>✓ 復寫完成</b><br>${esc(t[2])}</div><div class="actions"><button class="btn" onclick="render()">回到今日任務</button></div>`}}
function finishUI(){let d=S.day,s=DS(d);fs.classList.remove('hidden');fs.innerHTML=s.done?`<div class="feedback good" style="width:100%">✓ Day ${d} 已完成</div>`:`<button class="btn" onclick="completeDay()">✓ 完成今天任務</button><span class="small">進度會保存在這台裝置的瀏覽器。</span>`}
function completeDay(){let d=S.day,s=DS(d);s.done=true;if(d%7===0&&d<=56){let st=d-6,c=0,a=0;for(let x=st;x<=d;x++){c+=DS(x).fc;a+=DS(x).fa}S.weekly[Math.ceil(d/7)]=a?Math.round(c/a*100):0}save();render();scrollTo({top:0,behavior:'smooth'})}
function report(){let done=Array.from({length:60},(_,i)=>DS(i+1).done).filter(Boolean).length,ws=Object.keys(S.weekly).map(Number).sort((a,b)=>a-b),latest=ws.length?S.weekly[ws.at(-1)]:'--',w=Object.entries(S.weak).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,5),acc=S.fa?Math.round(S.fc/S.fa*100):'--';return`學測 60 天學習報告\n學生：${S.name||'未填'}\n已完成：${done}/60 天\n最近週表現：${latest}/100\n目標：70/100\n首次作答正確率：${acc}${acc==='--'?'':'%'}\n\n主要弱項：\n${w.length?w.map((x,i)=>`${i+1}. ${x[0]}：錯 ${x[1]} 次`).join('\n'):'目前無明顯弱項'}\n\n每週趨勢：\n${ws.length?ws.map(x=>`Week ${x}: ${S.weekly[x]}/100`).join('\n'):'尚未完成週檢查'}\n\n已修復項目：${S.mastered||0}`}
async function copyReport(){try{await navigator.clipboard.writeText(report());msg.textContent='✓ 報告已複製，可以直接貼給老師。'}catch(e){msg.textContent='瀏覽器未允許自動複製，請使用下載報告。'}}function downloadReport(){let b=new Blob([report()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='GSAT_report_'+(S.name||'student')+'.txt';a.click();URL.revokeObjectURL(a.href)}
dash();render();
</script>
</body></html>
